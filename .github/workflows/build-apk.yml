name: Build Android APK (Tracking DO - PIF)

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL GitHub Pages Anda (kosongkan untuk deteksi otomatis dari repo ini)'
        required: false
        default: ''
  push:
    branches:
      - main
      - master
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Siapkan Android SDK Bawaan Runner
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Tentukan URL Web Aplikasi untuk APK
        run: |
          TARGET_URL="${{ github.event.inputs.web_url }}"
          if [ -z "$TARGET_URL" ]; then
            OWNER="${{ github.repository_owner }}"
            REPO="${{ github.event.repository.name }}"
            OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
            REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
            if [ "$REPO_LOWER" = "${OWNER_LOWER}.github.io" ]; then
              BASE_URL="https://${OWNER_LOWER}.github.io/"
            else
              BASE_URL="https://${OWNER_LOWER}.github.io/${REPO}/"
            fi
            if [ -f "index.html" ]; then
              TARGET_URL="$BASE_URL"
            elif [ -f "frontend/index.html" ]; then
              TARGET_URL="${BASE_URL}frontend/"
            else
              TARGET_URL=""
            fi
          fi
          echo "TARGET_URL=$TARGET_URL" >> "$GITHUB_ENV"
          echo "Resolved default_web_url: $TARGET_URL"

      - name: Sisipkan URL ke strings.xml Android
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
        run: |
          python3 - << 'PY'
          import os, xml.etree.ElementTree as ET
          url = os.environ.get("TARGET_URL", "").strip()
          p = "android-apk/app/src/main/res/values/strings.xml"
          tree = ET.parse(p)
          root = tree.getroot()
          for elem in root.findall("string"):
              if elem.attrib.get("name") == "default_web_url":
                  elem.text = url
          tree.write(p, encoding="utf-8", xml_declaration=True)
          print("Updated strings.xml with URL:", url)
          PY

      - name: Compile Android Debug APK
        working-directory: android-apk
        run: gradle assembleDebug --no-daemon

      - name: Siapkan File APK untuk Diunduh
        run: |
          mkdir -p dist-apk
          cp android-apk/app/build/outputs/apk/debug/app-debug.apk dist-apk/TrackingDO-PIF-v1.1.0-GPS.apk

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackingDO-PIF-APK
          path: dist-apk/TrackingDO-PIF-v1.1.0-GPS.apk
          retention-days: 30

